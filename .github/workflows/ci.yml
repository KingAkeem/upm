name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o /tmp/upm ./cmd/main

      - name: Smoke dry-run publish preview
        run: /tmp/upm publish -n example-package -r npm

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: upm-linux-amd64
          path: /tmp/upm
